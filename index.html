<script type="module">
import { joinRoom } from 'https://esm.run/trystero/mqtt';

const App = {
  mySlug: null, myName: '', myPhoto: null,
  contacts: [], activeChat: null,
  lastRead: {}, unread: {}, lastMessages: {},
  room: null, roomPeerId: null,
  callPeer: null, localStream: null, activeCall: null,
  incomingCallData: null, muted: false,
  installPrompt: null, isInstalled: false,
  soundEnabled: true, vibrationEnabled: true,
  audioCtx: null, ringInterval: null, titleFlashInterval: null, callRingTimeout: null,
  originalTitle: 'JARVIS', connectedPeers: {}
};

// ——— Trystero actions (reset per room) ———
let sendChat, getChat, sendFile, getFile, onFileProgress;

const $ = id => document.getElementById(id);
const LS = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem('gcp_' + k)) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem('gcp_' + k, JSON.stringify(v)); } catch {} },
  del: (k) => localStorage.removeItem('gcp_' + k)
};

function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id)); }

let toastTimer;
function toast(msg, isError) {
  const t = $('toast'); t.textContent = msg;
  t.style.borderColor = isError ? '#ff4757' : '#d4af37';
  t.classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), isError ? 5000 : 2600);
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function slugify(name) { return String(name).toLowerCase().trim().replace(/[^a-z0-9]/g, '').slice(0, 20); }
function roomIdFor(a, b) { return [a, b].sort().join('__'); }
function avatarInner(photo, name) { return photo ? `<img src="${photo}" alt="">` : esc((name || '?').charAt(0).toUpperCase()); }
function fmtBytes(b) { if (!b) return ''; if (b < 1024) return b + ' B'; if (b < 1048576) return (b / 1024).toFixed(1) + ' KB'; return (b / 1048576).toFixed(1) + ' MB'; }

function getAudioCtx() { if (!App.audioCtx) { try { App.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } return App.audioCtx; }
function unlockAudio() { const ctx = getAudioCtx(); if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {}); }
document.addEventListener('click', unlockAudio);
document.addEventListener('touchstart', unlockAudio, { passive: true });

function playMessageSound() {
  if (!App.soundEnabled) return; const ctx = getAudioCtx(); if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  const now = ctx.currentTime;
  [880, 1320, 1760].forEach((freq, i) => {
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    const start = now + i * 0.09;
    gain.gain.setValueAtTime(0, start); gain.gain.linearRampToValueAtTime(0.22, start + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.001, start + 0.4);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(start); osc.stop(start + 0.42);
  });
}

function playSentSound() {
  if (!App.soundEnabled) return; const ctx = getAudioCtx(); if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  const now = ctx.currentTime;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type = 'sine'; osc.frequency.setValueAtTime(900, now); osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
  gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.05, now + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(now); osc.stop(now + 0.12);
}

function showBrowserNotification(title, body, tag) {
  if (!('Notification' in window)) return; if (Notification.permission !== 'granted') return; if (!document.hidden) return;
  try { const n = new Notification(title, { body: body || '', tag: tag || 'jarvis', silent: true }); n.onclick = () => { window.focus(); n.close(); }; setTimeout(() => { try { n.close(); } catch {} }, 8000); } catch {}
}

function startTitleFlash(prefix) {
  stopTitleFlash(); let toggle = false;
  App.titleFlashInterval = setInterval(() => { document.title = toggle ? (prefix || '🔔') + ' JARVIS' : App.originalTitle; toggle = !toggle; }, 800);
}
function stopTitleFlash() { if (App.titleFlashInterval) { clearInterval(App.titleFlashInterval); App.titleFlashInterval = null; } document.title = App.originalTitle; }
document.addEventListener('visibilitychange', () => { if (!document.hidden) stopTitleFlash(); });

async function requestNotificationPermission() {
  if (!('Notification' in window)) return 'unsupported'; if (Notification.permission === 'granted') return 'granted';
  if (Notification.permission === 'denied') return 'denied'; try { return await Notification.requestPermission(); } catch { return 'error'; }
}
function updatePermStatus() {
  const el = $('permStatus'); if (!el) return;
  if (!('Notification' in window)) { el.textContent = 'unsupported'; return; }
  const p = Notification.permission;
  if (p === 'granted') { el.textContent = '✓ enabled'; el.style.color = '#15803d'; }
  else if (p === 'denied') { el.textContent = 'blocked'; el.style.color = '#b91c1c'; }
  else { el.textContent = 'tap to enable'; el.style.color = '#d4af37'; }
}

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
App.isInstalled = isStandalone;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); App.installPrompt = e; if (!isStandalone) showInstallBanner(); });
window.addEventListener('appinstalled', () => { App.installPrompt = null; hideInstallBanner(); toast('App installed!'); App.isInstalled = true; });
function showInstallBanner() { if (isStandalone) return; if (LS.get('installBannerDismissed', false)) return; $('installBanner').classList.add('show'); }
function hideInstallBanner() { $('installBanner').classList.remove('show'); }
$('installBannerClose').addEventListener('click', () => { LS.set('installBannerDismissed', true); hideInstallBanner(); });
$('installBannerBtn').addEventListener('click', () => triggerInstall());
$('installMenuItem').addEventListener('click', () => triggerInstall());

async function triggerInstall() {
  if (isStandalone || App.isInstalled) { toast('Already installed'); return; }
  if (App.installPrompt) { App.installPrompt.prompt(); const choice = await App.installPrompt.userChoice; if (choice.outcome === 'accepted') { toast('Installing…'); hideInstallBanner(); } App.installPrompt = null; return; }
  if (isIOS) { openInstallModal('ios'); return; } openInstallModal('generic');
}

function openInstallModal(platform) {
  const body = $('installBody');
  if (platform === 'ios') {
    $('installSubtitle').textContent = 'Add JARVIS to your iPhone home screen';
    body.innerHTML = `<ol class="install-steps">
      <li>Open this page in <strong>Safari</strong>.</li>
      <li>Tap the <strong>Share button</strong> <span class="inline-icon">⬆</span>.</li>
      <li>Tap <strong>Add to Home Screen</strong> <span class="inline-icon">＋</span>.</li>
      <li>Tap <strong>Add</strong>.</li>
    </ol><button class="install-cta" onclick="document.getElementById('installModal').classList.remove('show')">Got it</button>`;
  } else {
    $('installSubtitle').textContent = 'Add JARVIS to your home screen';
    body.innerHTML = `<ol class="install-steps">
      <li>Open this page in <strong>Chrome</strong> or <strong>Edge</strong>.</li>
      <li>Tap the <strong>install icon</strong> <span class="inline-icon">⬇</span> in the address bar.</li>
      <li>Tap <strong>Install app</strong>.</li>
    </ol><button class="install-cta" onclick="document.getElementById('installModal').classList.remove('show')">Got it</button>`;
  }
  $('installModal').classList.add('show');
}
$('installClose').addEventListener('click', () => $('installModal').classList.remove('show'));

(function fixCloneButton() {
  const btn = document.getElementById('cloneBtn'); if (!btn) return;
  try { const host = window.location.hostname, path = window.location.pathname;
    if (host.endsWith('.github.io')) { const user = host.split('.')[0], repo = path.split('/').filter(Boolean)[0]; if (user && repo) { btn.href = `https://github.com/${user}/${repo}`; return; } }
    btn.href = 'https://github.com';
  } catch { btn.href = 'https://github.com'; }
})();

App.soundEnabled = LS.get('soundEnabled', true);
App.vibrationEnabled = LS.get('vibrationEnabled', true);

function updateToggleUI() { $('toggleSound').classList.toggle('on', App.soundEnabled); $('toggleVibration').classList.toggle('on', App.vibrationEnabled); }

$('toggleSound').addEventListener('click', () => { App.soundEnabled = !App.soundEnabled; LS.set('soundEnabled', App.soundEnabled); updateToggleUI(); toast(App.soundEnabled ? 'Sound on' : 'Sound off'); });
$('toggleVibration').addEventListener('click', () => { App.vibrationEnabled = !App.vibrationEnabled; LS.set('vibrationEnabled', App.vibrationEnabled); updateToggleUI(); toast(App.vibrationEnabled ? 'Vibration on' : 'Vibration off'); });
$('permBtn').addEventListener('click', async () => { const r = await requestNotificationPermission(); updatePermStatus(); if (r === 'granted') toast('Notifications enabled'); else if (r === 'denied') toast('Blocked', true); });

// ——— Onboarding ———
const nameInput = $('nameInput'), nameStatus = $('nameStatus'), enterBtn = $('enterBtn');
nameInput.addEventListener('input', () => {
  const slug = slugify(nameInput.value);
  if (!slug) { nameStatus.textContent = 'Lowercase letters and numbers only'; nameStatus.className = 'name-status'; enterBtn.disabled = true; return; }
  nameStatus.textContent = `Your room: ${slug}`; nameStatus.className = 'name-status ok'; enterBtn.disabled = false;
});
enterBtn.addEventListener('click', async () => {
  const slug = slugify(nameInput.value); if (!slug) return;
  unlockAudio();
  await requestNotificationPermission();
  updatePermStatus();
  App.mySlug = slug; App.myName = nameInput.value.trim() || slug;
  App.myPhoto = LS.get('avatar', null);
  LS.set('mySlug', slug); LS.set('myName', App.myName);
  startMainApp();
});

window.addEventListener('load', () => {
  updateToggleUI(); updatePermStatus(); loadContacts(); loadLastRead();
  const savedSlug = LS.get('mySlug'), savedName = LS.get('myName'), savedPhoto = LS.get('avatar');
  if (savedPhoto) App.myPhoto = savedPhoto;
  if (savedSlug && savedName) { App.mySlug = savedSlug; App.myName = savedName; startMainApp(); }
  document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); }));
});

function startMainApp() {
  showScreen('screen-main');
  updateProfileHeader();
  buildUI();
  if (!isStandalone) setTimeout(() => showInstallBanner(), 1500);
  updatePermStatus();
}

function updateProfileHeader() {
  $('profileName').textContent = App.myName;
  $('profileUsername').textContent = '@' + App.mySlug;
  $('profileUsername2').textContent = '@' + App.mySlug;
  const box = $('profileAvatar'), img = $('profileAvatarImg'), letter = $('profileAvatarLetter');
  if (App.myPhoto) { img.src = App.myPhoto; img.style.display = 'block'; letter.style.display = 'none'; box.classList.add('has-photo'); }
  else { img.src = ''; img.style.display = 'none'; letter.style.display = 'inline'; letter.textContent = App.myName.charAt(0).toUpperCase(); box.classList.remove('has-photo'); }
}

$('profileAvatar').addEventListener('click', e => { if (e.target === $('avatarRemove')) return; $('avatarInput').click(); });
$('avatarRemove').addEventListener('click', async e => {
  e.stopPropagation(); if (!confirm('Remove your profile photo?')) return;
  App.myPhoto = null; LS.del('avatar'); updateProfileHeader(); toast('Photo removed');
});
$('avatarInput').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0]; if (!file) return;
  if (!file.type.startsWith('image/')) { toast('Pick an image', true); return; }
  try { toast('Processing…'); const dataUrl = await resizeImage(file, 240); App.myPhoto = dataUrl; LS.set('avatar', dataUrl); updateProfileHeader(); toast('Photo updated'); } catch { toast('Failed', true); }
  e.target.value = '';
});

function resizeImage(file, size) {
  return new Promise((resolve, reject) => {
    const r = new FileReader(); r.onerror = reject;
    r.onload = ev => { const img = new Image(); img.onerror = reject; img.onload = () => {
      const c = document.createElement('canvas'); c.width = size; c.height = size;
      const ctx = c.getContext('2d'); const min = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width - min) / 2, (img.height - min) / 2, min, min, 0, 0, size, size);
      resolve(c.toDataURL('image/jpeg', 0.82));
    }; img.src = ev.target.result; };
    r.readAsDataURL(file);
  });
}

function loadContacts() { App.contacts = LS.get('contacts', []); }
function saveContacts() { LS.set('contacts', App.contacts); }
function loadLastRead() { App.lastRead = LS.get('lastRead', {}); }
function saveLastRead() { LS.set('lastRead', App.lastRead); }

// ——— Add contact ———
let addLookupResult = null;
$('addContactFab').addEventListener('click', () => { $('modalName').value = ''; $('modalStatus').textContent = ''; $('modalStatus').className = 'modal-status'; $('modalConfirm').disabled = true; addLookupResult = null; $('addModal').classList.add('show'); });
$('modalCancel').addEventListener('click', () => $('addModal').classList.remove('show'));
$('modalName').addEventListener('input', () => {
  const slug = slugify($('modalName').value);
  if (!slug) { $('modalStatus').textContent = ''; $('modalConfirm').disabled = true; return; }
  if (slug === App.mySlug) { $('modalStatus').textContent = "That's your own name"; $('modalStatus').className = 'modal-status bad'; $('modalConfirm').disabled = true; return; }
  addLookupResult = { slug, displayName: slug };
  $('modalStatus').textContent = `Will connect to: @${slug}`; $('modalStatus').className = 'modal-status ok'; $('modalConfirm').disabled = false;
});
$('modalConfirm').addEventListener('click', () => {
  if (!addLookupResult) return;
  addContactBySlug(addLookupResult.slug, addLookupResult.displayName);
  $('addModal').classList.remove('show');
});

function addContactBySlug(slug, displayName) {
  if (slug === App.mySlug) return toast("That's you");
  if (App.contacts.find(c => c.slug === slug)) return toast('Already added');
  App.contacts.push({ slug, name: displayName, addedAt: Date.now(), photo: null });
  saveContacts(); buildUI(); toast('Added @' + slug);
}

function updateUnreadBadges() {
  const total = Object.values(App.unread).reduce((s, n) => s + (n || 0), 0);
  const chatsBtn = document.querySelector('.nav-item[data-tab="chats"]');
  if (chatsBtn) {
    let b = chatsBtn.querySelector('.nav-badge');
    if (!b) { b = document.createElement('span'); b.className = 'nav-badge'; chatsBtn.appendChild(b); }
    if (total > 0) { b.textContent = total > 99 ? '99+' : String(total); b.classList.add('show'); } else b.classList.remove('show');
  }
  if (!App.titleFlashInterval) { document.title = total > 0 ? `(${total}) JARVIS` : 'JARVIS'; App.originalTitle = document.title; }
  document.querySelectorAll('[data-contact-slug]').forEach(el => {
    const slug = el.dataset.contactSlug; const n = App.unread[slug] || 0;
    const badge = el.querySelector('.unread-badge'), title = el.querySelector('.list-item-title'), sub = el.querySelector('.list-item-sub');
    if (badge) { if (n > 0) { badge.textContent = n > 99 ? '99+' : n; badge.classList.add('show'); } else badge.classList.remove('show'); }
    if (title) title.classList.toggle('unread', n > 0); if (sub) sub.classList.toggle('unread', n > 0);
  });
}

function previewText(last) {
  if (!last) return 'Tap to chat';
  if (last.attachment) { const a = last.attachment; const tag = a.type === 'image' ? '📷 Photo' : a.type === 'video' ? '🎥 Video' : a.type === 'audio' ? '🎤 Audio' : '📎 ' + (a.name || 'File'); return last.text ? tag + ' · ' + last.text : tag; }
  return last.text || '';
}

// ——— Media attachment rendering (with pending/failed state) ———
function renderAttachment(m) {
  const a = m.attachment; if (!a) return '';
  const status = a.pending ? '<div class="attach-status">Sending…</div>'
               : a.failed ? '<div class="attach-status failed">Failed to send</div>' : '';
  if (a.type === 'image') return `<img class="attach-img" src="${a.url}" loading="lazy" onclick="window.__lb('${a.url}','${esc(a.name||'photo')}')">${status}`;
  if (a.type === 'video') return `<video class="attach-video" controls playsinline webkit-playsinline preload="metadata" src="${a.url}"></video>${status}`;
  if (a.type === 'audio') return `<audio class="attach-audio" controls preload="metadata" src="${a.url}"></audio>${status}`;
  return `<a class="attach-file" href="${a.url}" target="_blank" rel="noopener" download="${esc(a.name||'file')}"><span class="file-icon">📄</span><span class="file-info"><span class="file-name">${esc(a.name||'File')}</span><span class="file-size">${fmtBytes(a.size)}</span></span><span style="font-size:20px;color:var(--muted)">⬇</span></a>${status}`;
}

function renderMessages(slug, msgs) {
  const area = $('messagesArea'); if (!area) return;
  if (!msgs.length) { area.innerHTML = '<div class="empty"><p style="font-size:13px;">Say hello 👋<br><small style="font-size:11px;opacity:.7">Both users must be online at the same time.</small></p></div>'; return; }
  area.innerHTML = msgs.map(m => {
    const out = m.from === App.mySlug;
    const t = m.time ? new Date(m.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
    const hasA = !!m.attachment;
    const cls = `msg ${out ? 'out' : 'in'}${hasA ? ' has-attachment' : ''}`;
    const aHtml = hasA ? renderAttachment(m) : '';
    const cHtml = (hasA && m.text) ? `<div class="msg-caption">${esc(m.text)}</div>` : '';
    const tHtml = (!hasA && m.text) ? esc(m.text) : '';
    return `<div class="${cls}">${aHtml}${cHtml}${tHtml}<span class="time">${t}${out ? '<span class="tick">✓</span>' : ''}</span></div>`;
  }).join('');
  area.scrollTop = area.scrollHeight;
}

function buildUI() {
  const cl = $('contactsList'), ccl = $('callContactsList'), vmSel = $('vmRecipient');
  if (!App.contacts.length) {
    cl.innerHTML = '<div class="empty"><div class="empty-icon">💬</div><p>No contacts yet.<br>Tap <strong>＋</strong> and type someone\'s name.</p></div>';
    ccl.innerHTML = '<div class="empty"><div class="empty-icon">📞</div><p>Add a contact to call them.</p></div>';
    vmSel.innerHTML = '<option value="">Select contact</option>'; updateUnreadBadges(); return;
  }
  cl.innerHTML = App.contacts.map(c => {
    const n = App.unread[c.slug] || 0;
    const last = App.lastMessages[c.slug] && App.lastMessages[c.slug].length ? App.lastMessages[c.slug][App.lastMessages[c.slug].length - 1] : null;
    let sub = previewText(last); sub = sub.length > 34 ? sub.slice(0, 34) + '…' : sub;
    const connected = App.connectedPeers[c.slug] ? '🟢 ' : '';
    return `<div class="list-item" data-contact-slug="${c.slug}"><div class="avatar">${avatarInner(c.photo, c.name)}</div><div class="list-item-body"><div class="list-item-title${n>0?' unread':''}">${connected}${esc(c.name)}</div><div class="list-item-sub${n>0?' unread':''}">${esc(sub)}</div></div><div class="unread-badge${n>0?' show':''}">${n>99?'99+':n}</div><div class="list-item-action">›</div></div>`;
  }).join('');
  ccl.innerHTML = App.contacts.map(c => `<div class="list-item" data-call-slug="${c.slug}"><div class="avatar accent">${avatarInner(c.photo, c.name)}</div><div class="list-item-body"><div class="list-item-title">${esc(c.name)}</div><div class="list-item-sub">Tap to call</div></div><div class="list-item-action">📞</div></div>`).join('');
  vmSel.innerHTML = '<option value="">Select contact</option>' + App.contacts.map(c => `<option value="${c.slug}">${esc(c.name)}</option>`).join('');
  cl.querySelectorAll('[data-contact-slug]').forEach(el => el.addEventListener('click', () => openChat(el.dataset.contactSlug)));
  ccl.querySelectorAll('[data-call-slug]').forEach(el => el.addEventListener('click', () => startCall(el.dataset.callSlug)));
  updateUnreadBadges();
}

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
    $('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).style.display = 'block';
    $('headerTitle').textContent = { chats: 'Chats', calls: 'Calls', voicemail: 'Voicemail', profile: 'Profile' }[tab];
    $('addContactFab').style.display = (tab === 'chats' || tab === 'calls') ? 'flex' : 'none';
  });
});

// ——— Chat ———
function updateChatHeader(c) { $('chatName').textContent = c.name; $('chatAvatar').innerHTML = avatarInner(c.photo, c.name); }

async function openChat(slug) {
  const c = App.contacts.find(x => x.slug === slug); if (!c) return;
  App.activeChat = slug;
  updateChatHeader(c); $('sendBtn').disabled = false;
  App.lastRead[slug] = Date.now(); saveLastRead(); App.unread[slug] = 0; updateUnreadBadges();
  $('emojiPalette').classList.remove('show');
  showScreen('screen-chat');
  const msgs = App.lastMessages[slug] || [];
  renderMessages(slug, msgs);
  $('chatStatus').textContent = App.connectedPeers[slug] ? 'connected' : 'connecting…';
  $('chatStatus').style.color = App.connectedPeers[slug] ? 'var(--green)' : 'rgba(255,255,255,.7)';
  await joinChatRoom(slug);
}

// ——— Room setup + media transfer module ———
async function joinChatRoom(peerSlug) {
  if (App.room) { try { App.room.leave(); } catch {} App.room = null; }

  // Reset all actions so stale handlers from the previous room are gone
  sendChat = getChat = sendFile = getFile = onFileProgress = undefined;

  const roomId = roomIdFor(App.mySlug, peerSlug);
  try {
    App.room = joinRoom({ appId: 'jarvis-p2p-v1' }, roomId);
    App.roomPeerId = App.room.selfId;

    // --- text ---
    [sendChat, getChat] = App.room.makeAction('chat');
    // --- binary / media (Trystero handles chunking + progress internally) ---
    [sendFile, getFile, onFileProgress] = App.room.makeAction('file');

    // Register the receive handlers ONCE per room (not per peer-join, which
    // caused duplicate messages on reconnect).
    getChat((data) => {
      const msg = {
        from: data.from || peerSlug,
        text: data.text,
        time: data.time || Date.now(),
        attachment: data.attachment || null
      };
      App.lastMessages[peerSlug] = (App.lastMessages[peerSlug] || []).concat(msg);
      if (App.activeChat !== peerSlug || document.hidden) {
        playMessageSound();
        if (navigator.vibrate && App.vibrationEnabled) navigator.vibrate([80, 40, 80]);
        showBrowserNotification('💬 ' + peerSlug, previewText(msg));
        App.unread[peerSlug] = (App.unread[peerSlug] || 0) + 1;
        updateUnreadBadges();
      }
      if (App.activeChat === peerSlug) renderMessages(peerSlug, App.lastMessages[peerSlug]);
      else buildUI();
    });

    // Trystero delivers a Blob for File/Blob sends — this is the fix.
    getFile((data, from, meta) => {
      const blob = data instanceof Blob
        ? data
        : new Blob([data], { type: meta?.mime || 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const type = meta?.type || detectFileType({ type: blob.type, name: meta?.name || '' });
      const msg = {
        from: peerSlug,
        text: '',
        time: Date.now(),
        attachment: { type, name: meta?.name || 'file', size: blob.size, url }
      };
      App.lastMessages[peerSlug] = (App.lastMessages[peerSlug] || []).concat(msg);
      if (App.activeChat !== peerSlug || document.hidden) {
        playMessageSound();
        if (navigator.vibrate && App.vibrationEnabled) navigator.vibrate([80, 40, 80]);
        showBrowserNotification('📎 ' + peerSlug, meta?.name || 'File', 'file-' + Date.now());
        App.unread[peerSlug] = (App.unread[peerSlug] || 0) + 1;
        updateUnreadBadges();
      }
      if (App.activeChat === peerSlug) renderMessages(peerSlug, App.lastMessages[peerSlug]);
      else buildUI();
    });

    // Live upload progress for outgoing files (0…1)
    onFileProgress((percent) => {
      const bar = $('uploadBar'), fill = $('uploadBarFill');
      if (!bar || !fill) return;
      bar.classList.add('show');
      fill.style.width = Math.max(5, Math.round(percent * 100)) + '%';
      if (percent >= 1) setTimeout(() => { bar.classList.remove('show'); fill.style.width = '0%'; }, 500);
    });

    App.room.onPeerJoin = () => {
      App.connectedPeers[peerSlug] = true;
      if (App.activeChat === peerSlug) {
        $('chatStatus').textContent = 'connected';
        $('chatStatus').style.color = 'var(--green)';
      }
      buildUI();
    };
    App.room.onPeerLeave = () => {
      App.connectedPeers[peerSlug] = false;
      if (App.activeChat === peerSlug) {
        $('chatStatus').textContent = 'disconnected';
        $('chatStatus').style.color = 'rgba(255,255,255,.7)';
      }
      buildUI();
    };
  } catch (e) {
    console.error('Room join failed:', e);
    toast('Could not join room — check connection', true);
  }
}

async function sendMessage() {
  const input = $('chatInput'); const text = input.value.trim();
  if (!text || !App.activeChat || !sendChat) return;
  const msg = { from: App.mySlug, text, time: Date.now() };
  try {
    await sendChat(msg);
    App.lastMessages[App.activeChat] = (App.lastMessages[App.activeChat] || []).concat({ ...msg, attachment: null });
    renderMessages(App.activeChat, App.lastMessages[App.activeChat]);
    input.value = ''; $('sendBtn').disabled = true; playSentSound();
  } catch { toast('Send failed — peer may be offline', true); }
}

$('sendBtn').addEventListener('click', sendMessage);

// ——— Media upload (the rewritten part) ———
const MAX_BYTES = 100 * 1024 * 1024;

$('attachBtn').addEventListener('click', (e) => {
  e.preventDefault();
  if (!App.activeChat) { toast('Open a chat first', true); return; }
  if (!sendFile) { toast('Not connected yet', true); return; }
  const inp = $('fileInput'); inp.value = ''; inp.click();
});

$('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;

  if (!App.activeChat) { toast('Open a chat first', true); e.target.value = ''; return; }
  if (!sendFile) { toast('Not connected yet', true); e.target.value = ''; return; }
  if (file.size > MAX_BYTES) {
    toast(`Too large: ${fmtBytes(file.size)} (max ${fmtBytes(MAX_BYTES)})`, true);
    e.target.value = ''; return;
  }

  const type = detectFileType(file);
  const recipient = App.activeChat;
  const bar = $('uploadBar'), fill = $('uploadBarFill');
  bar.classList.add('show');
  fill.style.width = '5%';

  // Show the message immediately with a local preview + "Sending…" badge
  const localUrl = URL.createObjectURL(file);
  const localMsg = {
    from: App.mySlug,
    text: '',
    time: Date.now(),
    attachment: { type, name: file.name, size: file.size, url: localUrl, pending: true }
  };
  App.lastMessages[recipient] = (App.lastMessages[recipient] || []).concat(localMsg);
  if (App.activeChat === recipient) renderMessages(recipient, App.lastMessages[recipient]);

  try {
    // Send the File object directly. Trystero chunks it and reports
    // progress through onFileProgress, and the receiver gets a Blob.
    await sendFile(file, null, {
      type,
      name: file.name,
      mime: file.type || 'application/octet-stream',
      size: file.size
    });

    localMsg.attachment.pending = false;
    if (App.activeChat === recipient) renderMessages(recipient, App.lastMessages[recipient]);
    playSentSound();
    toast('Sent ✓');
  } catch (err) {
    console.error('File send failed:', err);
    localMsg.attachment.pending = false;
    localMsg.attachment.failed = true;
    if (App.activeChat === recipient) renderMessages(recipient, App.lastMessages[recipient]);
    toast('Send failed: ' + (err?.message || 'unknown'), true);
  } finally {
    setTimeout(() => { bar.classList.remove('show'); fill.style.width = '0%'; }, 600);
    e.target.value = '';
  }
});

function detectFileType(file) {
  const m = (file.type || '').toLowerCase(), n = (file.name || '').toLowerCase();
  if (m.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|bmp|heic|svg|tiff)$/.test(n)) return 'image';
  if (m.startsWith('video/') || /\.(mp4|mov|webm|avi|mkv|m4v|3gp|ogv)$/.test(n)) return 'video';
  if (m.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|aac|flac|opus|weba)$/.test(n)) return 'audio';
  return 'file';
}

window.__lb = (url, name) => { $('lightboxImg').src = url; $('lightboxDownload').href = url; $('lightboxDownload').download = name || 'photo'; $('lightbox').classList.add('show'); };
$('lightboxClose').addEventListener('click', () => $('lightbox').classList.remove('show'));

// ——— Voicemail ———
const recordBtn = $('recordBtn');
recordBtn.addEventListener('click', async () => {
  if (App.mediaRecorder && App.mediaRecorder.state === 'recording') { App.mediaRecorder.stop(); return; }
  const recipient = $('vmRecipient').value; if (!recipient) return toast('Select a recipient', true);
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    App.recordedChunks = [];
    App.mediaRecorder = new MediaRecorder(stream);
    App.mediaRecorder.ondataavailable = e => { if (e.data.size > 0) App.recordedChunks.push(e.data); };
    App.mediaRecorder.onstop = async () => {
      clearTimeout(App.recordTimer); stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(App.recordedChunks, { type: 'audio/webm' });
      const url = URL.createObjectURL(blob);
      const msg = { from: App.mySlug, text: '', time: Date.now(), attachment: { type: 'audio', name: '🎤 Voice message', size: blob.size, url } };
      App.lastMessages[recipient] = (App.lastMessages[recipient] || []).concat(msg);
      if (App.activeChat === recipient) renderMessages(recipient, App.lastMessages[recipient]);
      toast('Voicemail saved locally');
      recordBtn.textContent = '⬤ Tap to Record (max 30s)'; recordBtn.classList.remove('recording');
    };
    App.mediaRecorder.start(); recordBtn.textContent = '⬛ Tap to Stop'; recordBtn.classList.add('recording');
    toast('Recording…'); App.recordTimer = setTimeout(() => { if (App.mediaRecorder && App.mediaRecorder.state === 'recording') { App.mediaRecorder.stop(); } }, 30000);
  } catch { toast('Microphone denied', true); }
});

  App.contacts = []; App.lastRead = {}; App.unread = {}; App.lastMessages = {};
  buildUI(); toast('Cleared');
});
