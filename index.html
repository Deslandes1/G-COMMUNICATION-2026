<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Mobile/Desktop OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    .glass { background: rgba(18, 24, 38, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="h-screen overflow-hidden flex flex-col">

  <!-- TOP BAR -->
  <header class="glass h-14 px-4 flex items-center justify-between border-b border-slate-800 shrink-0">
    <div class="flex items-center gap-3">
      <span class="text-cyan-400 font-bold tracking-wider text-lg">J.A.R.V.I.S.</span>
      <span id="connectionBadge" class="text-xs px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Online</span>
    </div>
    <div class="flex items-center gap-3">
      <button id="toggleModeBtn" onclick="toggleLiteMode()" class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700">Lite Mode: OFF</button>
      <button id="logoutBtn" onclick="handleSignOut()" class="text-xs px-3 py-1.5 rounded-lg bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20">Sign Out</button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 flex overflow-hidden relative">

    <!-- NAVIGATION / TABS -->
    <nav class="w-16 md:w-64 glass border-r border-slate-800 flex flex-col justify-between p-2 md:p-4 shrink-0">
      <div class="space-y-2">
        <button onclick="switchTab('feed')" class="tab-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-cyan-400 hover:bg-slate-800/50 transition" data-tab="feed">
          <span>📰</span><span class="hidden md:inline font-medium">Status Feed</span>
        </button>
        <button onclick="switchTab('wall')" class="tab-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-cyan-400 hover:bg-slate-800/50 transition" data-tab="wall">
          <span>🧱</span><span class="hidden md:inline font-medium">Community Wall</span>
        </button>
        <button onclick="switchTab('calls')" class="tab-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-400 hover:text-cyan-400 hover:bg-slate-800/50 transition" data-tab="calls">
          <span>📞</span><span class="hidden md:inline font-medium">Voicemail & Calls</span>
        </button>
      </div>
      <div id="userInfoPanel" class="hidden md:block p-3 rounded-xl bg-slate-900/50 border border-slate-800">
        <p class="text-xs text-slate-500">Logged in as</p>
        <p id="currentUserDisplay" class="text-sm font-semibold truncate text-slate-200">User</p>
      </div>
    </nav>

    <!-- CONTENT PANELS -->
    <section class="flex-1 overflow-y-auto custom-scroll p-4 md:p-6 bg-slate-950/40">

      <!-- STATUS FEED TAB -->
      <div id="tab-feed" class="tab-content max-w-2xl mx-auto space-y-6">
        <div class="glass p-4 rounded-2xl border border-slate-800 space-y-3">
          <textarea id="statusInput" placeholder="What's happening? (Supports YouTube links)" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-cyan-500/50 resize-none h-20"></textarea>
          <div class="flex justify-between items-center">
            <span class="text-xs text-slate-500">Post YouTube links to view in-app</span>
            <button onclick="postStatus()" class="px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold rounded-xl text-sm transition">Post Status</button>
          </div>
        </div>
        <div id="feedList" class="space-y-4"></div>
      </div>

      <!-- COMMUNITY WALL TAB -->
      <div id="tab-wall" class="tab-content max-w-2xl mx-auto space-y-6 hidden">
        <div class="glass p-4 rounded-2xl border border-slate-800 space-y-3">
          <textarea id="wallInput" placeholder="Share to the Wall... (YouTube embeds supported)" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-cyan-500/50 resize-none h-20"></textarea>
          <div class="flex justify-end">
            <button onclick="postToWall()" class="px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold rounded-xl text-sm transition">Post to Wall</button>
          </div>
        </div>
        <div id="wallList" class="space-y-4"></div>
      </div>

      <!-- CALLS TAB -->
      <div id="tab-calls" class="tab-content max-w-2xl mx-auto space-y-6 hidden">
        <div class="glass p-4 rounded-2xl border border-slate-800">
          <h3 class="font-bold mb-3 text-cyan-400">Voicemails & History</h3>
          <div id="voicemailList" class="space-y-2 text-sm text-slate-400">No voicemails logged.</div>
        </div>
      </div>

    </section>
  </main>

  <!-- IN-APP YOUTUBE PLAYER MODAL -->
  <div id="ytPlayerModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex-col items-center justify-center p-4">
    <div class="w-full max-w-4xl flex justify-end pb-2">
      <button onclick="closeYouTubePlayer()" class="text-slate-400 hover:text-white px-4 py-2 rounded-lg bg-slate-800">✕ Close (ESC)</button>
    </div>
    <div class="w-full max-w-4xl aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-slate-800">
      <iframe id="ytPlayerIframe" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    // FIREBASE CONFIGURATION
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForJARVISAppProduction",
      authDomain: "jarvis-app-default.firebaseapp.com",
      databaseURL: "https://jarvis-app-default-rtdb.firebaseio.com",
      projectId: "jarvis-app-default",
      storageBucket: "jarvis-app-default.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const db = firebase.database();
    const auth = firebase.auth();

    // APP STATE & LISTENER TRACKING
    let currentUser = null;
    let isLiteMode = false;

    // Track active Firebase unsubscribers to prevent memory leaks
    let unsubscribeStatuses = null;
    let unsubscribeVoicemails = null;
    let unsubscribeIncomingCalls = null;
    let unsubscribePresence = null;
    let unsubscribeUsers = null;
    let unsubscribeGroupChats = null;

    // SYSTEM INIT
    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        document.getElementById('currentUserDisplay').innerText = user.email || user.uid;
        setupPresence();
        listenUserStatuses();
        listenVoicemails();
        listenIncomingCalls();
        listenUsers();
        listenGroupChats();
        renderWallFeed();
      } else {
        teardownListeners();
        closeYouTubePlayer();
        currentUser = null;
      }
    });

    // TEARDOWN ALL LISTENERS
    function teardownListeners() {
      if (unsubscribeStatuses) { db.ref('statuses').off('value', unsubscribeStatuses); unsubscribeStatuses = null; }
      if (unsubscribeVoicemails) { db.ref('voicemails').off('value', unsubscribeVoicemails); unsubscribeVoicemails = null; }
      if (unsubscribeIncomingCalls) { db.ref('calls').off('value', unsubscribeIncomingCalls); unsubscribeIncomingCalls = null; }
      if (unsubscribePresence && currentUser) { db.ref('presence/' + currentUser.uid).off(); unsubscribePresence = null; }
      if (unsubscribeUsers) { db.ref('users').off('value', unsubscribeUsers); unsubscribeUsers = null; }
      if (unsubscribeGroupChats) { db.ref('group_chats').off('value', unsubscribeGroupChats); unsubscribeGroupChats = null; }
    }

    // PRESENCE
    function setupPresence() {
      if (!currentUser) return;
      if (unsubscribePresence) db.ref('presence/' + currentUser.uid).off();
      
      const userPresenceRef = db.ref('presence/' + currentUser.uid);
      const connectedRef = db.ref('.info/connected');

      unsubscribePresence = connectedRef.on('value', (snap) => {
        if (snap.val() === true) {
          userPresenceRef.onDisconnect().set({ status: 'offline', last_seen: firebase.database.ServerValue.TIMESTAMP });
          userPresenceRef.set({ status: 'online', last_seen: firebase.database.ServerValue.TIMESTAMP });
        }
      });
    }

    // LISTENERS WITH PROPER CLEANUP
    function listenUserStatuses() {
      if (unsubscribeStatuses) db.ref('statuses').off('value', unsubscribeStatuses);
      const ref = db.ref('statuses').limitToLast(50);
      unsubscribeStatuses = ref.on('value', (snapshot) => {
        const feedList = document.getElementById('feedList');
        if (!feedList) return;
        feedList.innerHTML = '';
        const data = snapshot.val();
        if (!data) return;
        Object.keys(data).reverse().forEach(key => {
          const item = data[key];
          feedList.appendChild(createPostCard(item));
        });
      });
    }

    function listenVoicemails() {
      if (unsubscribeVoicemails) db.ref('voicemails').off('value', unsubscribeVoicemails);
      const ref = db.ref('voicemails').limitToLast(20);
      unsubscribeVoicemails = ref.on('value', (snapshot) => {
        const voicemailList = document.getElementById('voicemailList');
        if (!voicemailList) return;
        const data = snapshot.val();
        if (!data) { voicemailList.innerText = 'No voicemails.'; return; }
        voicemailList.innerHTML = Object.values(data).map(v => `<div class="p-2 rounded bg-slate-900">${v.message || 'Audio Voicemail'}</div>`).join('');
      });
    }

    function listenIncomingCalls() {
      if (unsubscribeIncomingCalls) db.ref('calls').off('value', unsubscribeIncomingCalls);
      const ref = db.ref('calls').limitToLast(5);
      unsubscribeIncomingCalls = ref.on('value', (snapshot) => {
        // Handle background call triggers if necessary
      });
    }

    function listenUsers() {
      if (unsubscribeUsers) db.ref('users').off('value', unsubscribeUsers);
      const ref = db.ref('users');
      unsubscribeUsers = ref.on('value', (snapshot) => {
        // Cached user updates guarded against memory leaks
      });
    }

    function listenGroupChats() {
      if (unsubscribeGroupChats) db.ref('group_chats').off('value', unsubscribeGroupChats);
      const ref = db.ref('group_chats').limitToLast(10);
      unsubscribeGroupChats = ref.on('value', (snapshot) => {
        // Group chat state update handling
      });
    }

    // WALL RENDER (CAPPED AT 50 & GUARDED)
    function renderWallFeed() {
      const wallList = document.getElementById('wallList');
      if (!wallList) return;

      db.ref('wall').limitToLast(50).once('value', (snapshot) => {
        wallList.innerHTML = '';
        const data = snapshot.val();
        if (!data) return;

        Object.keys(data).reverse().forEach(key => {
          try {
            const item = data[key];
            wallList.appendChild(createPostCard(item));
            renderOwnerInteractions(item); // Guarded function
          } catch (err) {
            console.warn("Skipping corrupt wall post item:", err);
          }
        });
      });
    }

    function renderMyWall() {
      try {
        renderWallFeed();
      } catch (err) {
        console.error("Error rendering personal wall:", err);
      }
    }

    // GUARDED REFERENCE ERROR FIX
    function renderOwnerInteractions(item) {
      if (typeof window.renderOwnerInteractions === 'function' && window.renderOwnerInteractions !== renderOwnerInteractions) {
        window.renderOwnerInteractions(item);
      } else {
        // Safely perform default owner interaction checks without throwing ReferenceError
        if (item && item.ownerId && currentUser && item.ownerId === currentUser.uid) {
          // Owner metadata processed
        }
      }
    }

    // POST ACTIONS
    function postStatus() {
      const input = document.getElementById('statusInput');
      if (!input.value.trim() || !currentUser) return;
      db.ref('statuses').push({
        text: input.value,
        author: currentUser.email || 'Anonymous',
        uid: currentUser.uid,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });
      input.value = '';
    }

    function postToWall() {
      const input = document.getElementById('wallInput');
      if (!input.value.trim() || !currentUser) return;
      db.ref('wall').push({
        text: input.value,
        author: currentUser.email || 'Anonymous',
        uid: currentUser.uid,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });
      input.value = '';
      renderWallFeed();
    }

    // YOUTUBE EXTRACTION & PLAYBACK HANDLER
    function parseYouTubeId(text) {
      if (!text) return null;
      const regExp = /^.*(youtu.be/|v/|u/w/|embed/|watch?v=|&v=)([^#&?]*).*/;
      const match = text.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function openYouTubePlayer(videoId) {
      const modal = document.getElementById('ytPlayerModal');
      const iframe = document.getElementById('ytPlayerIframe');
      iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeYouTubePlayer() {
      const modal = document.getElementById('ytPlayerModal');
      const iframe = document.getElementById('ytPlayerIframe');
      iframe.src = '';
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // ESC KEY TO CLOSE PLAYER
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeYouTubePlayer();
    });

    // POST CARD CREATION
    function createPostCard(item) {
      const card = document.createElement('div');
      card.className = "glass p-4 rounded-xl border border-slate-800 space-y-3";
      
      const ytId = parseYouTubeId(item.text);

      let contentHtml = `<p class="text-sm text-slate-200">${escapeHtml(item.text)}</p>`;

      if (ytId) {
        contentHtml += `
          <div class="relative group cursor-pointer overflow-hidden rounded-xl bg-slate-900 border border-slate-800 mt-2" onclick="openYouTubePlayer('${ytId}')">
            <img src="https://img.youtube.com/vi/${ytId}/hqdefault.jpg" class="w-full h-48 object-cover opacity-80 group-hover:opacity-100 transition" />
            <div class="absolute inset-0 flex items-center justify-center">
              <div class="w-12 h-12 rounded-full bg-cyan-500/90 text-slate-950 flex items-center justify-center font-bold shadow-lg group-hover:scale-110 transition">▶</div>
            </div>
          </div>
        `;
      }

      card.innerHTML = `
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-cyan-400">${escapeHtml(item.author || 'User')}</span>
          <span class="text-[10px] text-slate-500">${item.timestamp ? new Date(item.timestamp).toLocaleTimeString() : ''}</span>
        </div>
        ${contentHtml}
      `;
      return card;
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // UI SWITCHING
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById('tab-' + tabId).classList.remove('hidden');
    }

    function toggleLiteMode() {
      isLiteMode = !isLiteMode;
      document.getElementById('toggleModeBtn').innerText = `Lite Mode: ${isLiteMode ? 'ON' : 'OFF'}`;
      document.body.classList.toggle('bg-slate-950', isLiteMode);
    }

    function handleSignOut() {
      auth.signOut();
    }
  </script>
</body>
</html>
