<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b2a4a">
<title>404 — G Communication Portal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(160deg, #0b2a4a 0%, #143a5f 60%, #0d7a8c 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .box { max-width: 420px; }
  .logo {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: #d4af37;
    color: #0b2a4a;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 42px; font-weight: 800;
    margin-bottom: 24px;
    box-shadow: 0 8px 30px rgba(212,175,55,.35);
  }
  h1 { font-size: 64px; font-weight: 800; margin-bottom: 8px; letter-spacing: 2px; }
  h2 { font-size: 20px; font-weight: 600; margin-bottom: 14px; opacity: .9; }
  p { font-size: 14px; line-height: 1.6; opacity: .75; margin-bottom: 28px; }
  a {
    display: inline-block;
    padding: 14px 32px;
    border-radius: 12px;
    background: #d4af37;
    color: #0b2a4a;
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .5px;
  }
  .footer { margin-top: 36px; font-size: 11px; opacity: .55; letter-spacing: .5px; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">G</div>
    <h1>404</h1>
    <h2>Page not found</h2>
    <p>The page you are looking for does not exist on the G Communication Portal.</p>
    <a href="./">← Back to the app</a>
    <div class="footer">Gesner Deslandes · Software Developer</div>
  </div>
</body>
</html>
